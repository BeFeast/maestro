# Retired direct-inference workflow (#1210). Review production belongs to the
# daemon native reviewer; no repository variable enables this legacy bypass.
name: llm-review-retired

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  retired:
    runs-on: ubuntu-latest
    steps:
      - name: Explain retirement
        run: printf '%s\n' 'Direct-inference CI review is retired. Configure the daemon native reviewer.'
